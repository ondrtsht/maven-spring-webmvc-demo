<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <title>パスキー管理 - WebAuthn Demo</title>
</head>
<body>
    <h1>登録済みパスキーの管理</h1>
    <button onclick="loadPasskeys()">一覧を更新</button>
    <ul id="passkey-list"></ul>
    <p id="msg"></p>

    <script>
        async function loadPasskeys() {
            const res = await fetch('/demo/api/auth/webauthn/passkeys?username=user1');
            const list = await res.json();
            const ul = document.getElementById('passkey-list');
            ul.innerHTML = '';

            list.forEach(item => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <strong>${item.name}</strong> (作成日: ${item.createdAt})
                    <button onclick="renamePasskey('${item.id}')">名前変更</button>
                    <button onclick="deletePasskey('${item.id}')">削除</button>
                `;
                ul.appendChild(li);
            });
        }

        async function deletePasskey(id) {
            if (!confirm('削除しますか？')) return;
            const res = await fetch(`/demo/api/auth/webauthn/passkeys/${id}`, { method: 'DELETE' });
            const data = await res.json();
            document.getElementById('msg').textContent = data.message;
            loadPasskeys();
        }

        async function renamePasskey(id) {
            const name = prompt('新しい名前を入力してください:');
            if (!name) return;
            const res = await fetch(`/demo/api/auth/webauthn/passkeys/${id}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name })
            });
            const data = await res.json();
            document.getElementById('msg').textContent = data.message;
            loadPasskeys();
        }

        loadPasskeys();
    </script>
</body>
</html>
