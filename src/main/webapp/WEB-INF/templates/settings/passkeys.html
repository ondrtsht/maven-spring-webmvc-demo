<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">

<head>
    <meta charset="UTF-8">
    <title>パスキー管理 - WebAuthn Demo</title>
</head>

<body>
    <h1>登録済みパスキーの管理</h1>
    <button onclick="loadPasskeys()">一覧を更新</button>
    <ul id="passkey-list"></ul>
    <p id="msg"></p>

    <script>
        async function loadPasskeys() {
            const res = await fetch('/demo/api/auth/webauthn/passkeys');
            if (!res.ok) {
                document.getElementById('msg').textContent =
                    'パスキー一覧の取得に失敗しました。';
                return;
            }

            const list = await res.json();
            const ul = document.getElementById('passkey-list');

            ul.replaceChildren();

            list.forEach(item => {
                const li = document.createElement('li');

                const strong = document.createElement('strong');
                strong.textContent = item.userVerifiedName;

                const renameButton = document.createElement('button');
                renameButton.textContent = '名前変更';
                renameButton.addEventListener('click', () => {
                    renamePasskey(item.credentialId);
                });

                const deleteButton = document.createElement('button');
                deleteButton.textContent = '削除';
                deleteButton.addEventListener('click', () => {
                    deletePasskey(item.credentialId);
                });

                li.append(
                    strong,
                    document.createTextNode(' '),
                    renameButton,
                    document.createTextNode(' '),
                    deleteButton
                );
                ul.appendChild(li);
            });
        }

        async function deletePasskey(id) {
            if (!confirm('削除しますか？')) return;
            const res = await fetch(`/demo/api/auth/webauthn/passkeys/${encodeURIComponent(id)}`,`, { method: 'DELETE' });
            const data = await res.json();
            document.getElementById('msg').textContent = data.message;
            loadPasskeys();
        }

        async function renamePasskey(id) {
            const name = prompt('新しい名前を入力してください:');
            if (!name) return;
            const res = await fetch(`/demo/api/auth/webauthn/passkeys`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name })
            });
            const data = await res.json();
            document.getElementById('msg').textContent = data.message;
            loadPasskeys();
        }

        loadPasskeys();
    </script>
</body>

</html>
